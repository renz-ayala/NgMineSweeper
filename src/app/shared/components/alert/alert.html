<div class="fixed top-2 sm:top-4 left-1/2 -translate-x-1/2 z-[9999] w-[calc(100%-2rem)] max-w-sm pointer-events-none flex flex-col gap-2.5">
  @for (item of alert(); track item.id) {
    @if (item.type === 'achievement') {
      <div class="pointer-events-auto flex items-center gap-3 p-3 bg-[#171a21]/95 border border-[#66c0f4]/40 rounded-sm shadow-[0_0_15px_rgba(0,0,0,0.8)] backdrop-blur-md animate-in fade-in slide-in-from-top-4">
        <div class="w-10 h-10 bg-gradient-to-br from-[#2a475e] to-[#1b2838] border border-[#66c0f4]/50 rounded shrink-0 flex items-center justify-center text-lg shadow-inner">
          🏆
        </div>

        <div class="flex flex-col flex-1 min-w-0">
          <span class="text-[9px] font-black uppercase tracking-widest text-[#66c0f4]">
            {{ langService.i18n().achievementUnlocked }}
          </span>
          @if (item.title) {
            <span class="text-xs font-bold text-white truncate [text-shadow:_0_1px_2px_#000]">
              {{ item.title }}
            </span>
          }
          @if (item.message) {
            <span class="text-[11px] text-[#c6d4df] leading-tight line-clamp-2">
              {{ item.message }}
            </span>
          }
        </div>

        <button
          type="button"
          class="p-1 text-[#c6d4df] hover:text-white transition-colors shrink-0"
          (click)="alertService.close(item.id)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    } @else {
      <div class="pointer-events-auto transition-all duration-300 ease-out">
        <div
          class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl border backdrop-blur-md transition-all duration-300 animate-in fade-in slide-in-from-top-4"
          [ngClass]="{
            'bg-emerald-950/90 border-emerald-500/30 text-emerald-200': item.type === 'success',
            'bg-rose-950/90 border-rose-500/30 text-rose-200': item.type === 'error'
          }"
        >
          @if (item.type === 'success') {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          }

          <span class="text-sm font-medium leading-tight flex-1">
            {{ item.message }}
          </span>

          <button
            type="button"
            class="p-1 rounded-md opacity-60 hover:opacity-100 transition-opacity shrink-0 hover:bg-white/10"
            (click)="alertService.close(item.id)"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    }

  }
</div>
